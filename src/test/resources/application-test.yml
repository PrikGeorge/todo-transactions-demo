spring:
  datasource:
    url: jdbc:h2:mem:todo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: TodoHikariPool
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

demo:
  external-delay-ms: 50
