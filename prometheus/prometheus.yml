global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'todo-tx-monitor'

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'todo-app'
    metrics_path: '/actuator/prometheus'
    # 5s - для демо, чтобы графики реагировали быстро.
    # В production ставьте 15-30 секунд.
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8080']
